name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_mode:
        description: 'Visual regression: off, compare or update baseline'
        required: true
        default: 'off'
        type: choice
        options:
          - off
          - compare
          - update

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests headless
        run: npm test
        env:
          CI: true

      - name: Compare visual baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_mode == 'compare' }}
        run: npm run test:visual
        env:
          CI: true

      - name: Generate visual baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_mode == 'update' }}
        run: npm run test:visual:update
        env:
          CI: true

      - name: Upload generated visual baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_mode == 'update' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-linux
          path: tests/visual-regression.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
